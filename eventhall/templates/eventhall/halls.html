
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Halls</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #f4f6f9;
        }
        .hall-card{
            transition: 0.3s;
            border-radius: 15px;
        }
        .hall-card:hover{
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">Event Hall</a>
    <div>
        <a href="{% url 'my_bookings' %}" class="btn btn-outline-light btn-sm">My Bookings</a>
        <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4">Available Event Halls</h2>

    <div class="row">
        {% for hall in halls %}
        <div class="col-md-4 mb-4">
            <div class="card hall-card shadow">
                <img src="{{ hall.image.url }}" class="card-img-top" height="200">

                <div class="card-body">
                    <h5 class="card-title">{{ hall.name }}</h5>
                    <p class="card-text">
                        Capacity: {{ hall.capacity }} people <br>
                        Price: ₹{{ hall.price }} / day
                    </p>

                    <a href="{% url 'book_hall' hall.id %}" class="btn btn-primary w-100">
                        Book Now
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <p class="text-center">No halls available</p>
        {% endfor %}
    </div>
</div>

</body>
</html>
