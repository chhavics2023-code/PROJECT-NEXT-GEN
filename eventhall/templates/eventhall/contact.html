

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | Event Hall Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .contact-card {
            border-radius: 15px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="{% url 'home' %}">Event Hall</a>
    <div class="ms-auto">
        <a href="{% url 'home' %}" class="btn btn-light btn-sm">Home</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card contact-card shadow p-4">

        <h2 class="text-center mb-3">Contact Us</h2>

        <p class="text-center">
            Have questions or need assistance? Feel free to contact us using the
            form below.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea name="message" class="form-control" rows="4" required></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">
                    Send Message
                </button>
            </div>
        </form>

        <hr>

        <div class="text-center">
            <p><strong>Email:</strong> support@eventhall.com</p>
            <p><strong>Phone:</strong> +91 98765 43210</p>
            <p><strong>Address:</strong> City Center, India</p>
        </div>

    </div>
</div>

</body>
</html>
